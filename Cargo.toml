[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/academic",
    "crates/devtrack",
    "crates/challenges",
    "crates/tray",
    "tui",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
devcore-core = { path = "crates/core" }
devcore-academic = { path = "crates/academic" }
devcore-devtrack = { path = "crates/devtrack" }
devcore-challenges = { path = "crates/challenges" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.35.0", features = ["bundled"] }
git2 = "0.21.0"
thiserror = "2.0.19"
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
uuid = { version = "1.24.0", features = ["v4"] }
dirs = "5.0.1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
